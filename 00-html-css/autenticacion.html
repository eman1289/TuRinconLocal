<!DOCTYPE html>
<html lang="es">

<head>
  <title>TuRinconLocal - creacion de cuenta</title>
  <meta charset="UTF-8">
  <meta name="description" content="Encuentra negocios locales
    ,ofertas exclusivas y servicios unicos cerca de ti.">

  <link rel="stylesheet" href="./styles.css" />

  <script type="module" src="../01-javascript/script.js"></script>
</head>

<body>
  <header>
    <h1>
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"
        class="icon icon-tabler icons-tabler-outline icon-tabler-building-store">
        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
        <path d="M3 21l18 0" />
        <path d="M3 7v1a3 3 0 0 0 6 0v-1m0 1a3 3 0 0 0 6 0v-1m0 1a3 3 0 0 0 6 0v-1h-18l2 -4h14l2 4" />
        <path d="M5 21l0 -10.15" />
        <path d="M19 21l0 -10.15" />
        <path d="M9 21v-4a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v4" />
      </svg>
      TuRinconLocal
    </h1>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="Categorias.html">Categorias</a>
      <a href="#">Ofertas</a>
    </nav>
    <div>
      <a href="./iniciar-sesión.html" class="login">Iniciar Sesión</a>
    </div>

  </header>

  <main>
    <section class="pagina-registro">
      <h2>Crea tu cuenta</h2>
      <p>Únete a nuestra comunidad de negocios locales</p>

      <div class="tabs-container">
        <button type="button" class="tab-btn active" onclick="cambiarModo('usuario')">Comprador</button>
        <button type="button" class="tab-btn" onclick="cambiarModo('negocio')">Negocio</button>
      </div>
      <form>
        <input type="hidden" id="tipoUsuario" name="role" value="usuario">

        <div id="campos-negocio" style="display: none;">
          <div class="form-group">
            <label for="nombre-negocio">Nombre del negocio</label>
            <input type="text" id="nombre-negocio" name="nombre-negocio"
              placeholder="Introduce el nombre de tu negocio">
          </div>

          <div class="form-group">
            <label for="tipo-negocio">Tipo de negocio</label>
            <select id="tipo-negocio" name="tipo-negocio">
              <option value="">Selecciona una categoría</option>
              <option value="Restaurante">Restaurante</option>
              <option value="Puesto de comida">Puesto de comida</option>
              <option value="Papelería">Papelería</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" placeholder="tu@email.com" required>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="Crea una contraseña segura" required
            minlength="8">
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirmar contraseña</label>
          <input type="password" id="confirm-password" name="confirm-password"
            placeholder="Vuelve a escribir la contraseña" required minlength="8">
        </div>

        <div class="form-group checkbox">
          <label for="terminos" class="checkbox-label">
            <input type="checkbox" name="terminos" required>
            <span>
              Acepto los <a href="#">Términos y Condiciones</a> y la <a href="#">Política de Privacidad</a>
            </span>
          </label>
        </div>

        <div class="form-group">
          <button type="submit">Crear Cuenta</button>
        </div>
      </form>

      <p class="enlace-inferior">¿Ya tienes una cuenta? <a href="./iniciar-sesión.html">Inicia sesión</a></p>
    </section>
  </main>
  <script>
    function cambiarModo(modo) {

      const cajaNegocio = document.getElementById('campos-negocio');
      const inputOculto = document.getElementById('tipoUsuario');
      const inputNombre = document.getElementById('nombre-negocio');
      const inputTipo = document.getElementById('tipo-negocio');
      const botones = document.querySelectorAll('.tab-btn');


      if (!cajaNegocio || !botones.length) return;

      if (modo === 'negocio') {

        cajaNegocio.style.display = 'block';
        inputOculto.value = 'negocio';
        inputNombre.required = true;
        inputTipo.required = true;

        botones[0].classList.remove('active');
        botones[1].classList.add('active');

      } else {

        cajaNegocio.style.display = 'none';
        inputOculto.value = 'usuario';
        inputNombre.required = false;
        inputTipo.required = false;


        inputNombre.value = "";
        inputTipo.value = "";

        botones[0].classList.add('active');
        botones[1].classList.remove('active');
      }
    }


    document.addEventListener('DOMContentLoaded', () => {
      cambiarModo('usuario');
    });
  </script>





</body>

</html>
