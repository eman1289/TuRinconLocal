    ,ofertas exclusivas y servicios unicos cerca de ti.">

  <link rel="stylesheet" href="./styles.css" />

</head>

<body>
  <header>
    <h1>
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"
        class="icon icon-tabler icons-tabler-outline icon-tabler-building-store">
        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
        <path d="M3 21l18 0" />
        <path d="M3 7v1a3 3 0 0 0 6 0v-1m0 1a3 3 0 0 0 6 0v-1m0 1a3 3 0 0 0 6 0v-1h-18l2 -4h14l2 4" />
        <path d="M5 21l0 -10.15" />
        <path d="M19 21l0 -10.15" />
        <path d="M9 21v-4a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v4" />
      </svg>
      TuRinconLocal
    </h1>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="Categorias.html">Categorias</a>
      <a href="#">Ofertas</a>
    </nav>
    <div>
      <a href="./autenticacion.html" class="register">Registrarse</a>
    </div>
  </header>
  <main>
    <section class="Isesion">


      <h2>Bienvenido de nuevo</h2>
      <p>Inicia sesión en tu cuenta para continuar</p>

      <form class="form-group">
        <div>
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" placeholder="tu@email.com" required>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="Introduce tu contraseña" required
            minlength="8">
        </div>
        <div>
          <label for="olvidaste-contra">
            <a href="#">¿Olvidaste tu contraseña?</a>
          </label>
        </div>
        <div>
          <button type="submit">Iniciar Sesión</button>
        </div>
      </form>
      <p class="enlace-inferior">¿No tienes una cuenta?<a href="./autenticacion.html">Registrate</a></p>

    </section>



  </main>

</body>

</html>
