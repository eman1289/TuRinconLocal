<!DOCTYPE html>
<html lang="es">

<head>
  <title>TuRinconLocal - Negocios</title>
  <meta charset="UTF-8">
  <meta name="description" content="Listado de negocios locales
  para encontrar lo mejor de tu localidad.">

  <link rel="stylesheet" href="./styles.css" />
  <script type="module">
    import React from "https://esm.sh/react?dev";
    import ReactDOM from "https://esm.sh/react-dom/client?dev";
    window.React = React;
    window.ReactDOM = ReactDOM;
  </script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    function TarjetaNegocio({ negocio, nombre, descripcion, imagen, enlace }) {
      return (
        <div className="tarjeta-negocio"
          data-modalidad="${negocio.data?.modalidad}"
          data-ubicacion="${negocio.data?.ubicacion}"
          data-calificacion="${negocio.data?.calificacion}">
          <img src={negocio.imagen} alt={negocio.nombre} width="200px" />
          <h3>{negocio.titulo}</h3>
          <p>{negocio.descripcion}</p>
          <span class="rating">
            ★★★★☆ <span class="rating-num">{negocio.data.calificacion}</span>
          </span>
          <a href="./perfilnegocio.html" class="perfil">Ver Perfil</a>
        </div>
      );
    }
    function App() {
      return (
        <div className="tarjetas-grid">
          <TarjetaNegocio
            negocio={{
              titulo: "Cafetería Central",
              descripcion: "Una acogedora cafetería en el corazón de la ciudad.",
              imagen: "./cafe aromas.png",
              enlace: "./perfilnegocio.html",
              data: { calificacion: 4.5 }
            }}
          />

        </div>
      )

    }

    const rootEL = document.querySelector("#root");
    const root = ReactDOM.createRoot(rootEL);

    root.render(<App />);
  </script>


</head>

<body>

        class="icon icon-tabler icons-tabler-outline icon-tabler-building-store">

        <path d="M9 21v-4a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v4" />

    <nav>

    <div class="acciones-usuario">
